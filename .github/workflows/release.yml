name: Release and Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: '版本递增方式 (auto / patch / minor / major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  build-and-release:
    # 忽略由机器人自动创建的版本升级提交与 [skip ci]，避免循环触发
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test

      - name: Bump Version Automatically
        id: bump_version
        run: |
          node scripts/bump-version.mjs --${{ inputs.bump_type || 'auto' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Version Bump
        if: steps.bump_version.outputs.is_bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.bump_version.outputs.needs_commit }}" = "true" ]; then
            git add package.json src/constants/version.ts src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore(release): bump version to ${{ steps.bump_version.outputs.version }} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
          git tag ${{ steps.bump_version.outputs.version }} || true
          git push origin ${{ steps.bump_version.outputs.version }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Static Site
        run: pnpm build

      - name: Check if Release Already Exists
        id: check_release
        run: |
          exists=$(gh release view ${{ steps.bump_version.outputs.version }} --json tagName -q '.tagName' || echo "not_found")
          if [ "$exists" != "not_found" ]; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if Release Already Exists
        if: steps.check_release.outputs.release_exists == 'true'
        run: |
          echo "⚠️ Release ${{ steps.bump_version.outputs.version }} already exists. Skipping release creation..."
          echo "All subsequent steps will be skipped."

      - name: Generate Release Notes
        if: steps.check_release.outputs.release_exists == 'false'
        id: release_notes
        run: |
          prev_tag="${{ steps.bump_version.outputs.previous_tag }}"
          curr_version="${{ steps.bump_version.outputs.version }}"
          if [ -n "$prev_tag" ] && [ "$prev_tag" != "none" ]; then
            echo "🔄 更新日志($prev_tag → $curr_version)" > release.md
            echo "" >> release.md
            echo "## 📝 变更内容" >> release.md
            echo "" >> release.md
            git log $prev_tag..HEAD --pretty=format:'- [%s](https://github.com/${{ github.repository }}/commit/%H) by @%an' >> release.md
          else
            echo "🔄 更新日志(首次发布 $curr_version)" > release.md
            echo "" >> release.md
            echo "## 📝 变更内容" >> release.md
            echo "" >> release.md
            git log -n 15 --pretty=format:'- [%s](https://github.com/${{ github.repository }}/commit/%H) by @%an' >> release.md
          fi
          echo "Release notes generated successfully"

      - name: Create ZIP Archive
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          cd dist
          zip -r ../site-${{ steps.bump_version.outputs.version }}.zip ./*
          cd ..

      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.version }}
          name: Release ${{ steps.bump_version.outputs.version }}
          body_path: release.md
          files: site-${{ steps.bump_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release to Supabase Database
        if: steps.check_release.outputs.release_exists == 'false'
        run: node scripts/sync-github-releases.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ikdbwkrqlfksmjgrzchm.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
