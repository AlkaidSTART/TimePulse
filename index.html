<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f4eb" />
    <meta name="description" content="TimePulse - 一个现代化的倒计时网页应用" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
      onerror="this.onerror=null;this.media='none'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <script>
      try {
        const platform = navigator.platform || '';
        const userAgent = navigator.userAgent || '';
        const vendor = navigator.vendor || '';
        const isApplePlatform = /Mac|iPhone|iPad|iPod/i.test(platform) || /iPhone|iPad|iPod/i.test(userAgent);
        const isSafari = /Safari/i.test(userAgent) && /Apple/i.test(vendor) && !/Android|Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Opera/i.test(userAgent);
        const isAndroid = /Android/i.test(userAgent);
        const isWindows = /Win/i.test(platform) || /Windows/i.test(userAgent);
        const isTouchDevice = 'ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

        // 移动端/触摸设备原生滚动条性能更优且避免 DOM 包装破坏手势；桌面非 Apple 环境采用平滑自定义滚动
        if (isApplePlatform || isSafari || isAndroid || isTouchDevice) {
          document.documentElement.dataset.nativeScrollbars = 'true';
        }

        // 标记运行环境：Android / Windows 系统及 Tauri 客户端针对性适配
        const markPlatform = () => {
          const isTauri = window.isTauri === true || '__TAURI_INTERNALS__' in window;
          if (isTauri) document.documentElement.dataset.tauri = 'true';
          if (isAndroid) document.documentElement.dataset.platform = 'android';
          if (isWindows) document.documentElement.dataset.platform = 'windows';
          if (isTauri && isAndroid) document.documentElement.dataset.androidApp = 'true';
          if (isTauri && isWindows) document.documentElement.dataset.windowsApp = 'true';
        };
        markPlatform();
        document.addEventListener('DOMContentLoaded', markPlatform, { once: true });

        const savedTheme = localStorage.getItem('theme');
        const theme = savedTheme === 'light' ? 'light' : 'cream';
        if (theme === 'cream') {
          document.documentElement.classList.add('cream');
        } else {
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) metaThemeColor.setAttribute('content', '#ffffff');
        }
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      } catch (_) {
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
    <title>TimePulse - 现代化倒计时</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/register-sw.js" async></script>
  </body>
</html>
